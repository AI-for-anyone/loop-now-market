name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 格式检查
        run: node scripts/check.mjs
      # 取回每个条目并用 Loop Now 的插件宿主校验。loop-now 仓库公开前需要在本仓库的 secrets 里放一个
      # 能读取它的 LOOP_NOW_REPO_TOKEN；公开后默认令牌即可。
      - uses: actions/checkout@v4
        with:
          repository: AI-for-anyone/loop-now
          path: .loop-now
          token: ${{ secrets.LOOP_NOW_REPO_TOKEN || github.token }}
      - name: 构建插件宿主
        working-directory: .loop-now/plugins
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: 取回并校验每个条目
        env:
          LOOP_NOW_HOST_ENTRY: ${{ github.workspace }}/.loop-now/plugins/host/dist/main.js
        run: node scripts/check.mjs --fetch
